/* ============================================================
   HOTFIX for teachers.html
   These rules were missing from the CSS files this page loads.
   Safe to keep permanently — they only set what was missing.
   ============================================================ */

/* --- Toolbar (was only in students.css) --- */
.toolbar{
  display:flex;
  flex-wrap:wrap;
  gap:12px;
  align-items:center;
  background:#fff;
  border:1px solid var(--border);
  border-radius:var(--radius-lg);
  padding:18px 20px;
  box-shadow:var(--shadow-sm);
  margin-bottom:28px;
}
.toolbar .search{
  position:relative;
  flex:1 1 280px;
  min-width:0;
}
.toolbar .search input{
  width:100%;
  padding:12px 15px 12px 42px;
  border-radius:var(--radius-sm);
  border:1.5px solid var(--border);
  background:var(--bg);
  color:var(--text);
  font:inherit;
  font-size:14.5px;
  transition:.2s var(--ease);
}
.toolbar .search input:focus{
  outline:none;
  border-color:var(--primary);
  background:#fff;
  box-shadow:0 0 0 4px rgba(11,93,59,.1);
}
/* THE CRITICAL RULE — clamps the magnifying glass to 18px */
.toolbar .search svg{
  position:absolute;
  left:14px;
  top:50%;
  transform:translateY(-50%);
  width:18px;
  height:18px;
  color:var(--muted);
  pointer-events:none;
}
.toolbar select{
  padding:12px 40px 12px 15px;
  border-radius:var(--radius-sm);
  border:1.5px solid var(--border);
  background-color:var(--bg);
  color:var(--text);
  font:inherit;
  font-size:14px;
  font-weight:500;
  appearance:none;
  cursor:pointer;
  transition:.2s var(--ease);
  background-image:url("data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%235B6579' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='m6 9 6 6 6-6'/%3E%3C/svg%3E");
  background-repeat:no-repeat;
  background-position:right 14px center;
  background-size:16px;
}
.toolbar select:focus{
  outline:none;
  border-color:var(--primary);
  background-color:#fff;
  box-shadow:0 0 0 4px rgba(11,93,59,.1);
}
.toolbar .count{
  font-size:14px;
  color:var(--muted);
  font-weight:600;
  margin-left:auto;
  white-space:nowrap;
  padding-inline:6px;
}

/* --- Empty state (was only in the newer base.css) --- */
.empty-state{
  display:none;
  text-align:center;
  padding:64px 24px;
  background:#fff;
  border:1px dashed var(--border);
  border-radius:var(--radius-lg);
}
.empty-state.show{display:block}
/* THE CRITICAL RULE — clamps the empty-state icon to 56px */
.empty-state svg{
  width:56px;
  height:56px;
  color:var(--muted);
  opacity:.35;
  margin:0 auto 16px;
}
.empty-state h3{font-size:18px;margin-bottom:6px}
.empty-state p{color:var(--muted);font-size:14.5px}

/* --- Mobile --- */
@media (max-width:760px){
  .toolbar .count{
    margin-left:0;
    width:100%;
    text-align:right;
  }
}
</style>
